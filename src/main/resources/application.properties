spring.application.name=employee-leave-management

# Optional local overrides for developer environments (excluded by .gitignore)
spring.config.import=optional:classpath:application-local.properties,optional:file:.env.properties

# Database Configuration with Environment Variable substitution
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_leave_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=true

# Server Configuration
server.port=${SERVER_PORT:8080}