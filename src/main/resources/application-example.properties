# Example Configuration Template — Safe for Version Control
# Copy this file to src/main/resources/application-local.properties or set the corresponding environment variables.

spring.application.name=employee-leave-management

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/employee_leave_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.open-in-view=true

server.port=${SERVER_PORT:8080}
 
# JWT Authentication Configuration
jwt.secret=${JWT_SECRET:YourCustomSecureSecretKeyForJWTTokenSigningMustBe256Bits}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

